# Lucky Blocks outcome table.
# When a player breaks the configured lucky block, one outcome is rolled
# based on the weights below. Users can add their own outcomes by writing
# new entries here.
#
# Outcomes are composable: each outcome may contain any combination of the
# following optional action sections:
#
#   items       - A list of items to drop at the block location.
#                 Format: "<item> <quantity>" (quantity defaults to 1).
#                 Item names default to minecraft:<name> unless a namespace
#                 is specified (e.g. minecraft:diamond).
#
#   commands    - A section with a list of console commands to run.
#                 relative-to: BLOCK (default) or PLAYER determines how
#                 tildes (~) resolve.
#
#   structure   - A section with a structure name and optional random-rotation.
#                 Loads .nbt from challenges/lucky-block/structures/<name>.nbt.
#                 If loading or placing fails, the roll is rerolled (up to 20
#                 times).
#
#   feedback    - Optional custom sound, personal message, and broadcast.
#
# Any combination of sections is valid. An outcome with none of these
# sections is a valid empty outcome — the Lucky Block simply does nothing
# (unless feedback is configured).
#
# Reliable command generator: https://mcstacker.net/
# Reliable sounds finder:
# https://mudkipdev.github.io/minecraft-sound-explorer/
#
# Optional feedback section per outcome:
#   feedback:
#     sound:
#       enabled: true
#       sound: block.amethyst_block.step
#       pitch: 2.0
#       volume: 1.0
#     message: "<aqua>Personal message sent only to the player.</aqua>"
#     broadcast: "<aqua><white>{player}</white> broadcast sent to everyone else.</aqua>"
#
# The sound section requires both enabled and sound. pitch defaults to 1.0
# and volume defaults to 1.0. When no custom sound is configured, the default
# sound from config.yml (sounds.challenges.lucky-block-default) is played.
# {player} is replaced with the triggering player's name.
outcomes:
  diamonds:
    weight: 5.0
    items:
      - diamond 1
    feedback:
      sound:
        enabled: true
        sound: block.amethyst_block.step
        pitch: 2.0
        volume: 1.0
      message: "<aqua>You fancied yourself some diamonds!</aqua>"
      broadcast: "<aqua><white>{player}</white> fancied themselves diamonds!</aqua>"
  nothing:
    weight: 1.0
    feedback:
      sound:
        enabled: true
        sound: block.anvil.hit
        pitch: 1.2
        volume: 1.0
      message: "<gray>Nothing happened. How anticlimactic.</gray>"
  pigmen:
    weight: 1.2
    commands:
      relative-to: BLOCK # how tildes ~ ~ ~ resolve. choices: BLOCK or PLAYER
      commands:
        - "summon pig ~ ~ ~"
        - "summon pig ~ ~ ~"
        - "summon pig ~ ~ ~"
        - "summon lightning_bolt ~ ~ ~"
    feedback:
      sound:
        enabled: true
        sound: entity.zombified_piglin.angry
        pitch: 1.2
        volume: 0.8
      message: "<red>You angered the pigmen!</red>"
      broadcast: "<red><white>{player}</white> angered the pigmen!</red>"
  tnt: # weight omitted, default to 1.0
    commands:
      relative-to: PLAYER
      commands:
        - "summon tnt ~ ~1.5 ~ {fuse:40}"
    feedback:
      sound:
        enabled: true
        sound: entity.creeper.hurt
        pitch: 0.8
        volume: 1.0
      message: "<yellow>You hear a hiss...</yellow>"
  sharp-sword:
    commands:
      commands: # relative-to omitted, use BLOCK by default
        - "give <p> golden_sword[enchantments={sharpness:10},damage=29] 1"
    feedback:
      sound:
        enabled: true
        sound: entity.player.attack.sweep
        pitch: 1.2
        volume: 0.8
      message: "<gold>A sharp sword materializes in your hand!</gold>"
  coin-well:
    weight: 1.0
    structure:
      name: coin-well
    feedback:
      sound:
        enabled: true
        sound: block.bubble_column.whirlpool_inside
        pitch: 1.2
        volume: 1.0
      message: "<gray>Well, well, well..</gray>"
