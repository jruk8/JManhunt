# Version used by JManhunt to add missing message entries during upgrades.
messages-version: 1

# Placeholders: {prefix}, {player}, {role}, {distance}, {world}, {winner}, {stat}, {value}, {effect}, {seconds}, {rank-color}.
prefix: "<dark_gray>[<gold>JManhunt<dark_gray>] "

command:
  player-only: "{prefix}<red>Only players can use this command."
  no-permission: "{prefix}<red>You do not have permission to use this command."
  invalid: "{prefix}<red>Unknown command. Use <yellow>/manhunt help<red>."

manhunt:
  help-header: "{prefix}<gold>JManhunt commands:"
  help-line: "{prefix}<white>{command} <gray>- {description}"
  status-header: "{prefix}<gold>Manhunt status: <white>{status}"
  speedrunners-header: "\n{prefix}<gold>Speedrunners:"
  hunters-header: "\n{prefix}<gold>Hunters:"
  none-header: "\n{prefix}<gold>None:"
  status-player: "{prefix}<gray>{player}"
  no-match: "{prefix}<yellow>No match is active."
  set-success: "{prefix}<green>Updated <white>{count}<green> player(s) to <white>{role}<green>."
  role-assigned: "{prefix}<green>You have been assigned the role <white>{role}<green>."
  set-skipped: "{prefix}<yellow>Skipped <white>{count}<yellow> player(s) without the required permission."
  start-success: "{prefix}<green>Manhunt has started."
  waiting-for-damage: "{prefix}<yellow>A speedrunner must hit a hunter before the game begins."
  started-by-damage: "{prefix}<green>The Manhunt game has begun!"
  start-invalid: "{prefix}<red>A match needs at least one hunter and one speedrunner."
  already-active: "{prefix}<red>A match is already active."
  not-active: "{prefix}<yellow>No match is active."
  end-success: "{prefix}<green>Manhunt ended. Hunters win!"
  reload-success: "{prefix}<green>Reloaded config.yml and messages.yml."
  settings-usage: "{prefix}<yellow>Usage: /manhunt settings <setting> <true|false>"
  setting-invalid: "{prefix}<red>Unknown setting."
  setting-invalid-value: "{prefix}<red>Setting values must be true or false."
  setting-updated: "{prefix}<green>Set <white>{setting}<green> to <white>{value}<green>."
  setting-entry: "{prefix}<white>{setting}<gray>: <white>{value}"
  setting-status: "{prefix}<white>{setting}<gray> is currently <white>{value}<gray>."

game:
  separator: "<strikethrough><gradient:#bababa:#dedede:#bababa>                                                    </gradient></strikethrough>"
  debuff-applied: "{prefix}<gray>You have been given debuffs for the start of the game."
  speedrunners-win: "{prefix}<green>Speedrunners Win!"
  hunters-win: "{prefix}<red>Hunters Win!"
  hunters-title: "<red>Hunters Win!"
  speedrunners-title: "<green>Speedrunners Win!"
  stat-header: "\n{prefix}{stat-prefix}{stat}:"
  stat-header-prefix: "<bold><gradient:white:#dbdbdb:white>"
  stat-entry: "{prefix}{rank-color}#{rank}: {player}: {value}"
  rank-colors:
    first: "<#f5af5b>"
    second: "<#cccccc>"
    third: "<#85553c>"
    other: "<gray>"
  stat-names:
    DAMAGE_DEALT: "Damage Dealt"
    HUNTER_FINAL_KILLS: "Hunter Final Kills"
    SPEEDRUNNER_KILLS: "Speedrunner Kills"
    PROGRESSION: "Progression"
  progression-names:
    got_wood: "<#874f2a>Got Wood"
    got_iron: "<#c4c4c4>Got Iron"
    entered_nether: "<#c237de>Entered the Nether"
    found_bastion: "<#de802f>Found Bastion"
    found_fortress: "<#912d4b>Found Fortress"
    entered_stronghold: "<#88a698>Entered Stronghold"
    entered_end: "<#5fe888>Entered the End"

compass:
  compass-name: "<gold>Hunter's Compass"
  compass-lore:
    - "<gray>Tracks the nearest speedrunner."
    - "<gray><white>Right-click</white> to refresh when enabled."
  compass-actionbar: "<gold>Tracking <white>{player}<gold> • <white>{distance}m"
  no-target-actionbar: "<gray>No speedrunner location available."
