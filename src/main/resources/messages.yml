# Version used by JManhunt to add missing message entries during upgrades.
messages-version: 8

# Placeholders: {prefix}, {player}, {role}, {distance}, {world}, {winner}, {stat}, {value}, {effect}, {seconds}, {rank-color}.
prefix: "<#a6a6a6>[<gradient:#e66550:#de7766><bold>J</bold>Manhunt</gradient>]</#a6a6a6> "

command:
  player-only: "{prefix}<red>Only players can use this command."
  no-permission: "{prefix}<red>You do not have permission to use this command."
  invalid: "{prefix}<red>Unknown command. Use <yellow>/manhunt help<red>."
  no-targets: "{prefix}<yellow>No players matched that selector."

manhunt:
  help-header: "\n{prefix}\n<#de7766>JManhunt commands:"
  help-line: "<white>» {command}<gray>: {description}</gray></white>"
  status-header: "\n{prefix}\n<#de7766>Manhunt status: <white>{status}"
  speedrunners-header: "\n<#de7766>Speedrunners:"
  hunters-header: "\n<#de7766>Hunters:"
  afk-header: "\n<gray>AFK:"
  none-header: "\n<#de7766>None:"
  status-player: "<white>» <gray>{player}"
  spectators-line: "\n<#6e728a>👁 Spectators: <gray>{value}"
  status-win-speedrunners: "\n<gray>Speedrunners 🏆 on: <white>{conditions}"
  status-win-hunters: "\n<gray>Hunters 🏆 on: <white>{conditions}"
  status-elapsed: "\n<gray>Elapsed: <white>{duration}"
  status-ids: "\n<gray>{value}"
  no-match: "{prefix}<yellow>No match is active."
  set-success: "{prefix}<green>Updated <white>{count}<green> player(s) to <white>{role}<green>."
  set-success-unchanged: "{prefix}<green>Updated <white>{count}<green> player(s) to <white>{role}<green> (<white>{unchanged}<green> unchanged)."
  role-assigned: "{prefix}<green>You have been assigned the role <white>{role}<green>."
  set-skipped: "{prefix}<yellow>Skipped <white>{count}<yellow> player(s) without the required permission."
  start-success: "\n{prefix}<green>Manhunt has started."
  role-announce-chat: "{prefix}<green>You are a <white>{role}<green>."
  role-announce-title: "<gray>Role: <white>{role}"
  role-announce-subtitle-hunter: "<red>Kill all Speedrunners"
  role-announce-subtitle-speedrunner: "<green>Outsmart the Hunters"
  role-announce-subtitle-spectator: "<gray>Watch the Hunt"
  autostart-eligible: "{prefix}<yellow>Manhunt auto-starts in <white>{seconds}<yellow>s."
  autostart-countdown: "{prefix}<yellow>Manhunt starts in <white>{seconds}<yellow>s."
  autostart-cancelled: "{prefix}<yellow>Auto-start cancelled."
  waiting-for-damage: "{prefix}<yellow>A speedrunner must hit a hunter within <white>{seconds}s</white> to start the game."
  waiting-for-damage-indefinite: "{prefix}<yellow>A speedrunner must hit a hunter to start the game."
  waiting-for-damage-exhausted: "{prefix}<red>No speedrunner hit a hunter within <white>{seconds}s</white>. The game will not start."
  waiting-for-damage-force-started: "{prefix}<yellow>The game has automatically started because no speedrunner hit a hunter on time."
  started-by-damage: "{prefix}<green>The Manhunt game has begun!"
  headstart-active: "{prefix}<yellow>{role}s are in spectator mode for <white>{seconds}s</white>."
  headstart-ending: "{prefix}<yellow>{role}s return in <white>{seconds}s</white>."
  headstart-ended: "{prefix}<green>{role}s have spawned!"
  start-invalid: "{prefix}<red>A match needs at least one hunter and one speedrunner."
  queue-left: "{prefix}<yellow>{player} left the queue."
  already-active: "{prefix}<red>A match is already active."
  not-active: "{prefix}<yellow>No match is active."
  reload-success: "{prefix}<green>Reloaded config.yml, messages.yml, and settings."
  setting-invalid: "{prefix}<red>Unknown setting."
  setting-invalid-value: "{prefix}<red>Setting values must be true or false."
  setting-invalid-number: "{prefix}<red>That value is not valid for this setting."
  setting-updated: "{prefix}<green>Set <white>{setting}<green> to <white>{value}<green>. <gray>(was <white>{old-value}</white>)</gray>"
  setting-change-announced: "{prefix}<white>{player} <yellow>set setting <gray>{key}</gray> to <white>{value}</white>.</yellow></white>"
  setting-restart-required: "{prefix}<gray>This setting requires a server restart to take effect."
  setting-entry: "{prefix}<gray>{setting}:</gray> <white>{value}"
  configuration-list: "\n{prefix}<white>Available configs in <gray>{key}:{entries}"
  configuration-entry: "\n<green>» <white>{key}</white><gray>{suffix}</gray>"
  setting-status: "{prefix}<white>{setting}<gray> is currently <white>{value}<gray>."
  worldengine-usage: "{prefix}<yellow>Usage: /manhunt worldengine <setlobby|setlobbytp|cellindex|tpto>"
  worldengine-cellindex-usage: "{prefix}<yellow>Usage: /manhunt worldengine cellindex <get|set <value>|buffer>"
  worldengine-cellindex-get: "{prefix}<green>World-engine cell index: <white>{index}<green>."
  worldengine-cellindex-set: "{prefix}<green>Set world-engine cell index to <white>{index}<green> (was <white>{was}<green>, max <white>{max}<green>)."
  worldengine-cellindex-invalid: "{prefix}<red>Invalid cell index. Use a number between 0 and <white>{max}<red>."
  worldengine-cellindex-unavailable: "{prefix}<red>Cell index storage is unavailable."
  worldengine-disabled: '{prefix}<red>World engine is disabled. Enable it through <gray>"/manhunt configuration world-engine enabled true"</gray> to use this command.'
  worldengine-setlobby-success: "{prefix}<green>Set the world-engine lobby to <white>{location}<green>."
  worldengine-no-targets: "{prefix}<yellow>No players matched that selector."
  worldengine-invalid-location: "{prefix}<red>Invalid lobby location. Use <yellow>x,y,z,yaw,pitch<red>."
  worldengine-tpto-confirm: "{prefix}<yellow>Lobby world <white>{world}</white> does not exist. Run the command again within <white>{seconds}s</white> to generate it."
  worldengine-tpto-creating: "{prefix}<yellow>Creating lobby world <white>{world}</white>..."
  worldengine-tpto-success: "{prefix}<green>Teleported <white>{count}</white> player(s) to <white>{world}</white>."
  worldengine-tpto-no-world: "{prefix}<red>World <white>{world}</white> is not loaded."
  worldengine-tpto-failed: "{prefix}<red>Could not create lobby world <white>{world}</white>."
  worldengine-invalid-selector: "{prefix}<red>Invalid selector."
  worldengine-invalid-lobby: "{prefix}<red>The world-engine lobby world is not loaded."
  quickstart-invalid-percent: "{prefix}<red>Quick start percentage must be a number between 0 and 100."
  quickstart-failed: "{prefix}<red>Quick start requires at least one hunter and one speedrunner. AFK players are not assigned roles."
  status-all-header: "\n{prefix}\n<#de7766>Running instances:"
  status-all-entry: "<white>» <white>{lobby}|G{id} <gray>({remaining}/{assigned}) <white>{duration}"
  status-all-empty: "{prefix}<yellow>No matches are running."
  invalid-instance-id: "{prefix}<red>Unknown instance id."
  not-in-match: "{prefix}<yellow>You are not in a match."
  console-requires-id: "{prefix}<red>Specify an instance id or <yellow>all<red>."
  lobby-join-success: "{prefix}<green>Moved <white>{count}<green> player(s) to lobby <white>{lobby}<green> as <white>{role}<green>."
  lobby-leave-success: "{prefix}<green>Removed <white>{player}<green> from lobby <white>{lobby}<green>."
  lobby-invalid-id: "{prefix}<red>Invalid lobby id. Use a number between 0 and <white>2147483647<red>."
  lobby-full: "{prefix}<red>Lobby <white>{lobby}<red> is full for role <white>{role}<red>."
  lobby-no-location: "{prefix}<yellow>No lobby location exists for lobby <white>{lobby}<yellow>. Create one with <white>/manhunt worldengine setlobbytp {lobby}<yellow>."
  lobby-worldengine-required: "{prefix}<red>Enable the world engine to use multiple lobbies."
  debug-enabled: "{prefix}<green>Debug mode enabled."
  debug-disabled: "{prefix}<yellow>Debug mode disabled."
  worldengine-cellindex-buffer-header: "\n{prefix}\n<#de7766>Buffered cell ids:"
  worldengine-cellindex-buffer-entry: "<white>» <white>{index}"
  status-usage: "{prefix}<yellow>Usage: /manhunt status [id|all]"
  setplayer-usage: "{prefix}<yellow>Usage: /manhunt setplayer <selector> <hunter|speedrunner|spectator|afk|none> [-f|-force]"
  set-in-match: "{prefix}<yellow>{player} is in a running match. Manage them with <white>/manhunt game leave<yellow> and <white>/manhunt game join<yellow>."
  setplayer-held: "{prefix}<yellow>A match is in progress. You are queued as <white>{role}<yellow> for the next game."
  setplayer-held-summary: "{prefix}<yellow>{count} player(s) held for the next game (match in progress)."
  setplayer-joined: "{prefix}<green>Joined <white>{count}<green> player(s) to the running match as <white>{role}<green>."
  set-afk-confirm: "{prefix}<yellow>Run again within <white>10 seconds<yellow> to assign roles to <white>{count}<yellow> AFK player(s)."
  start-usage: "{prefix}<yellow>Usage: /manhunt start [lobby-id]"
  end-usage: "{prefix}<yellow>Usage: /manhunt end [id] [-i|-immediate]"
  game-usage: "{prefix}<yellow>Usage: /manhunt game <join|leave> ..."
  game-join-usage: "{prefix}<yellow>Usage: /manhunt game join <id> [role] [selector]"
  game-leave-usage: "{prefix}<yellow>Usage: /manhunt game leave [id] [selector]"
  lobby-usage: "{prefix}<yellow>Usage: /manhunt lobby <join|leave> ..."
  lobby-join-usage: "{prefix}<yellow>Usage: /manhunt lobby join <selector> <lobby-id> [role] [-f|-force] [-notp]"
  lobby-leave-usage: "{prefix}<yellow>Usage: /manhunt lobby leave [selector]"
  lobby-already-member: "{prefix}<yellow>{player} is already in lobby <white>{lobby}<yellow> as <white>{role}<yellow>."
  lobby-join-in-match: "{prefix}<yellow>{player} is in a running match. Use <white>/manhunt game join<yellow> to move them."
  lobby-leave-not-member: "{prefix}<yellow>{player} is not in a lobby."
  lobby-leave-in-match: "{prefix}<yellow>{player} is in a running match. Use <white>/manhunt game leave<yellow> to remove them."
  quickstart-usage: "{prefix}<yellow>Usage: /manhunt quickstart [percentage] [-f|-force]"
  configuration-usage: "{prefix}<yellow>Usage: /manhunt configuration <category> <key...> [value]"
  debug-usage: "{prefix}<yellow>Usage: /manhunt debug [on|off]"
  worldengine-setlobby-usage: "{prefix}<yellow>Usage: /manhunt worldengine setlobby [x,y,z,yaw,pitch]"
  worldengine-setlobbytp-usage: "{prefix}<yellow>Usage: /manhunt worldengine setlobbytp <lobby-id]"
  worldengine-tpto-usage: "{prefix}<yellow>Usage: /manhunt worldengine tpto <lobbyworld|gameworld> [selector]"
  worldengine-tpto-lobby-world-clash: "{prefix}<red>Lobby world name matches the game world. Rename <white>world-engine.lobby-world-name<red> first."

game:
  separator: "<strikethrough><gradient:#bababa:#dedede:#bababa>                                                    </gradient></strikethrough>"
  debuff-applied: "{prefix}<gray>You have been given debuffs for the start of the game."
  hunter-death: "{prefix}<yellow>A hunter has died!"
  hunter-respawn-scheduled: "{prefix}<yellow>{player} will respawn in <white>{seconds}s</white>."
  hunter-respawn-imminent: "{prefix}<green>{player} has respawned."
  hunter-out-of-lives: "{prefix}<yellow>A hunter has run out of lives and is eliminated."
  speedrunner-out-of-lives: "{prefix}<yellow>A speedrunner has run out of lives and is eliminated."
  speedrunners-unlimited-lives: "{prefix}<yellow>Speedrunners have unlimited lives."
  hunters-unlimited-lives: "{prefix}<yellow>Hunters have unlimited lives."
  speedrunner-death: "{prefix}<yellow>A speedrunner has died! <white>({value} remaining)</white>"
  last-speedrunner-death: "{prefix}<yellow>The last speedrunner has died!"
  last-hunter-removed: "{prefix}<yellow>The last hunter has been removed for disconnecting!"
  speedrunner-disconnect-warning: "{prefix}<yellow>A speedrunner has disconnected! They will be removed after <white>{seconds} seconds</white> unless they rejoin."
  speedrunner-disconnect-cancelled: "{prefix}<green>A disconnected speedrunner has rejoined the game."
  speedrunner-disconnect-removed: "{prefix}<yellow>A speedrunner has been removed for disconnecting."
  hunter-disconnect-warning: "{prefix}<yellow>A hunter has disconnected! They will be removed after <white>{seconds} seconds</white> unless they rejoin."
  hunter-disconnect-cancelled: "{prefix}<green>A disconnected hunter has rejoined the game."
  hunter-disconnect-removed: "{prefix}<yellow>A hunter has been removed for disconnecting."
  speedrunners-win: "{prefix}<green>Speedrunners Win!"
  hunters-win: "{prefix}<red>Hunters Win!"
  hunters-title: "<red>Hunters Win!"
  speedrunners-title: "<green>Speedrunners Win!"
  cancelled: "{prefix}<yellow>Manhunt match cancelled."
  cancelled-title: "<gray>Cancelled"
  join-success: "{prefix}<green>Added <white>{count}<green> player(s) to instance <white>{id}<green> as <white>{role}<green>."
  join-announce: "{prefix}<green>{player} has joined as a {role}."
  join-invalid-role: "{prefix}<red>Role must be hunter, speedrunner, spectator, or none."
  leave-confirm: "{prefix}<yellow>Run the command again within <white>10 seconds<yellow> to leave the match."
  leave-not-in-match: "{prefix}<yellow>You are not in a match."
  leave-success: "{prefix}<gray>You left the match."
  leave-removed: "{prefix}<green>Removed <white>{count}<green> player(s) from the match."
  hunter-left: "{prefix}<yellow>{player} left the match. <white>({remaining} hunters remaining)</white>"
  join-no-change: "{prefix}<yellow>No players were added (already in a match)."
  spawncamp-kill: "{prefix}<red><white>{player}</white> was slain for spawn camping <white>{victim}</white> <gray>({count} kills)</gray>"
  spawncamp-gear-wipe: "{prefix}<red><white>{player}</white>'s gear was wiped for spawn camping <white>{victim}</white> <gray>({count} kills)</gray>"
  speedrunner-left: "{prefix}<yellow>{player} left the match. <white>({remaining} speedrunners remaining)</white>"
  auto-left-bounds: "{prefix}<yellow>You left the match area and were removed from the match."
  auto-left-lobby-world: "{prefix}<yellow>You entered the lobby world and were removed from the match."
  time-left: "{prefix}<yellow>{winner} win in <white>{time}<yellow>."
  stat-header: "\n{stat-prefix}{stat}:"
  stat-header-prefix: "<bold><gradient:white:#dbdbdb:white>"
  stat-entry: "{rank-color}#{rank}: {player}: {value}"
  rank-colors:
    first: "<#f5af5b>"
    second: "<#cccccc>"
    third: "<#85553c>"
    other: "<gray>"
  stat-names:
    DAMAGE_DEALT: "Damage Dealt"
    HUNTER_FINAL_KILLS: "Hunter Final Kills"
    SPEEDRUNNER_KILLS: "Speedrunner Kills"
    PROGRESSION: "Progression"
  progression-names:
    got_wood: "<#874f2a>Got Wood"
    got_iron: "<#c4c4c4>Got Iron"
    entered_nether: "<#c237de>Entered the Nether"
    found_bastion: "<#de802f>Found Bastion"
    found_fortress: "<#912d4b>Found Fortress"
    entered_stronghold: "<#88a698>Entered Stronghold"
    entered_end: "<#5fe888>Entered the End"

compass:
  compass-name: "<#de7766>Hunter's Compass"
  compass-lore:
    - "<gray>Tracks the nearest speedrunner."
    - "<gray><white>Right-click</white> to refresh when enabled."
  compass-actionbar: "<#de7766>Tracking <white>{player}<#de7766> • <white>{distance}m"
  compass-last-seen-actionbar: "<#de7766>Tracking <white>{player}<#de7766>'s Last Seen • <white>{distance}m <gray>({reason})"
  no-target-actionbar: "<gray>No {role} location available."
  nearby-actionbar: "<green>{player} is nearby! The compass is disabled."
  too-far-actionbar: "<yellow>{player} is out of tracking range."
  analyzing-actionbar: "<gray>Analyzing..."

debug:
  prefix: "<gray>[<bold>J</bold>ManhuntDebug]</gray> "
  cell-fetched: "{debug-prefix}<gray>Fetched cell <white>{index} <gray>at <white>{x}<gray>, <white>{z}<gray>."
  cell-buffer-add: "{debug-prefix}<gray>Buffered cell <white>{index} <gray>({count}/{target})."
  cell-fetch-failed: "{debug-prefix}<gray>Cell fetch failed, retrying in <white>{seconds}s<gray>."
  match-start: "{debug-prefix}<gray>Match started in lobby <white>{lobby} <gray>on cell <white>{index}<gray>."
  match-end: "{debug-prefix}<gray>Match on cell <white>{index} <gray>ended."
  end-cell-reserved: "{debug-prefix}<gray>Reserved <white>{cell} <gray>for instance <white>{id}<gray>."
  end-cell-created: "{debug-prefix}<gray>Created end dimension <white>{cell}<gray>."
  end-cell-reset: "{debug-prefix}<gray>Reset end dimension <white>{cell}<gray>."
  end-cell-pruned: "{debug-prefix}<gray>Pruned end dimension <white>{cell}<gray>."
  border-mode: "{debug-prefix}<gray>Border mode: <white>{mode}<gray>."
  portal-reroute: "{debug-prefix}<gray>Rerouted <white>{player} <gray>to <white>{cell}<gray>."
