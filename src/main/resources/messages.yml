# One color tag per role. Used directly in templates as {role-color-<role>}
# and by code that builds colored role names.
role-colors:
  speedrunner: "<#74de66>"
  hunter: "<#de666e>"
  spectator: "<#6e728a>"
  afk: "<#a18e68>"
  none: "<#7d7d7d>"

