  setting-list-reset: "{prefix}<green>Reset <white>{setting}<green> to defaults."
  setting-change-announced: "{prefix}<white>{player} <yellow>set setting <gray>{key}</gray> to <white>{value}</white>.</yellow></white>"
  setting-restart-required: "{prefix}<gray>This setting requires a server restart to take effect."
