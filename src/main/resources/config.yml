# Used for config updates, don't change unless you know what you're doing.
config-version: 5


# Send anonymous statistics via bStats. We never collect personal data or IP addresses.
# Requires a server restart to take effect.
# Default: true
send-anonymous-statistics: true

# Message parser used for messages.yml: minimessage or legacy.
# Default: minimessage
text-format: minimessage


# Debug output for pinpointing laggy configuration, such as cell fetches and
# game starts. Toggled at runtime per player or for the console with
# /manhunt debug. This value is only the default applied on restart.
# Default: false
debug:
  enabled: false


# Persistent career statistics. SQLite is local and requires no setup. Use
# PostgreSQL when several JManhunt servers should share the same statistics.
# If you are upgrading from an older version, rename your existing jmanhunt.db
# file to statistics.db to keep your stored statistics.
statistics:
  enabled: true
  type: sqlite
  sqlite:
    file: statistics.db
  postgresql:
    host: localhost
    port: 5432
    database: jmanhunt
    username: jmanhunt
    password: change-me
    ssl: false
  pool-size: 4


# PlaceholderAPI placeholders. All placeholders must be used with the prefix
# %jmanhunt_<placeholder>% (e.g. %jmanhunt_total_kills%).
# Formatting is applied before PlaceholderAPI returns a value. {value} is the
# built-in value; formatting uses the selected text-format above. Values are
# disabled individually by setting enabled to false.
placeholders:
  time_as_speedrunner:
    enabled: true
    format: "{value}"
  time_as_hunter:
    enabled: true
    format: "{value}"
  formatted_time_as_speedrunner:
    enabled: true
    format: "{value}"
  formatted_time_as_hunter:
    enabled: true
    format: "{value}"
  total_kills:
    enabled: true
    format: "{value}"
  total_kills_as_hunter:
    enabled: true
    format: "{value}"
  total_kills_as_speedrunner:
    enabled: true
    format: "{value}"
  total_final_kills:
    enabled: true
    format: "{value}"
  total_damage_dealt:
    enabled: true
    format: "{value}"
  total_wins:
    enabled: true
    format: "{value}"
  total_wins_as_hunter:
    enabled: true
    format: "{value}"
  total_wins_as_speedrunner:
    enabled: true
    format: "{value}"
  total_game_sessions:
    enabled: true
    format: "{value}"
  sessions_as_speedrunner:
    enabled: true
    format: "{value}"
  sessions_as_hunter:
    enabled: true
    format: "{value}"
  formatted_total_playtime:
    enabled: true
    format: "{value}"
  total_kd_as_speedrunner:
    enabled: true
    format: "{value}"
  total_kd_as_hunter:
    enabled: true
    format: "{value}"


# Built-in game-state actions and optional commands. All command sections are
# disabled by default except default-commands.
# The default-commands options below run at both match start and match end
# when enabled.
gamestate-commands:
  default-commands:
    enabled: true
    auto-set-gamemode: true
    reset-players-stats: true
    disable-locator-bar: true
    set-respawn-immediate: true
    set-daytime: true
    disable-phantoms: true
  # Console commands run once per configured entry.
  console-commands:
    enabled: false
    start:
      - "say The hunt has begun!"
    end:
      - "say The hunt is over!"
  # Player commands run once for every online Hunter or Speedrunner. <p> is
  # replaced with that player's name. Commands may start with '/'.
  player-commands:
    enabled: false
    start:
      - "give <p> cooked_steak 8"
    end:
      - "clear <p>"


# Match lifecycle settings: end-of-match delay, pre-start reminders,
# disconnect rules, and end-screen statistics.
match:
  # Seconds between the win announcement and final inventory cleanup. Statistics
  # are displayed halfway through this delay.
  # Set to -1 to skip the delay (cleanup is immediate); other negative values are
  # also treated as zero.
  end-delay: 10.0

  # Seconds between reminders while waiting for the first speedrunner hit.
  # For finite delays, exactly three reminders are shown at the delay and two
  # equally-sized slices (e.g. 30s -> 30, 20, 10). This value is only used as
  # the repeat interval when delay-seconds is -1 (wait indefinitely).
  # Set to -1 to disable the reminders entirely while still waiting for damage.
  start-reminder-interval: 10.0

  # Disconnect rules for active participants.
  disconnect-handling:
    speedrunner:
      # Seconds a disconnected speedrunner has to rejoin before they are treated
      # as dead and removed from the match.
      reconnect-grace-seconds: 60
      # Disconnect strike limit before a speedrunner instantly loses.
      # Set to 1 to disable retries entirely.
      max-strikes: 3
    hunter:
      # Seconds a disconnected hunter has to rejoin before they are removed
      # from the match.
      reconnect-grace-seconds: 60
      # Disconnect strike limit before a hunter instantly loses.
      # Set to 1 to disable retries entirely.
      max-strikes: 3

  # End-screen sections, in display order. Available values are DAMAGE_DEALT,
  # HUNTER_FINAL_KILLS, SPEEDRUNNER_KILLS, and PROGRESSION. Progression is based
  # on reliable vanilla advancements and is calculated only at match end.
  end-statistics: [DAMAGE_DEALT, HUNTER_FINAL_KILLS, SPEEDRUNNER_KILLS, PROGRESSION]


# Lobby queues. Each lobby runs its own queue, autostart countdown, and match.
# Players join the default lobby on login and keep it until they join another
# lobby or leave the server.
lobbies:
  # Lobby id assigned on join. Use -1 (or any negative value) to leave players
  # without a lobby until they join one manually.
  # Default: 0
  default-lobby-id: 0
  # When true, joining a lobby also teleports the player to that lobby's
  # location. When no location exists for the lobby, the player is told to
  # create one instead of being teleported. The -notp join flag skips the
  # teleport for one invocation.
  # Default: true
  join-teleports-to-lobby: true
  # What /manhunt setplayer does when the target's lobby has a live match.
  # Only applies with the world engine on; otherwise the in-match block
  # stays. HOLD queues roles for the next game, JOIN_ANY joins any role
  # mid-match, JOIN_SPECTATORS joins spectators and holds everyone else,
  # SUBLOBBY queues roles for the next sublobby.
  # Default: SUBLOBBY
  mid-match-setplayer: SUBLOBBY
  # Per-role queue caps for each lobby. Only enforced on the queue before a
  # match starts, and bypassed with -force. Lowering a cap below the current
  # queue blocks new entries of that role but never kicks queued players.
  caps:
    # Max queued speedrunners per lobby. -1 means no limit. Minimum: 1.
    # Default: -1
    speedrunner: -1
    # Max queued hunters per lobby. -1 means no limit. Minimum: 1.
    # Default: -1
    hunter: -1


# Optional named command bundles. Toggle a bundle in-game with
# /manhunt configuration custom-modifiers <name> enabled true|false.
# All commands are run when the match starts (or on interval if configured),
# except console-cleanup and player-cleanup which run when the match ends.
custom-modifiers:
  # Gives every participating player eight steaks when the match starts.
  everyone-gets-beef:
    enabled: false
    commands:
      player:
        # Runs for every participating player (only hunters and speedrunners, not including NONE)
        - "give <p> minecraft:cooked_beef 8"
  speedrunners-speed-potion:
    enabled: false
    commands:
      speedrunner:
        # Runs only once for each Speedrunner, with <p> replaced by their name.
        # Note the single quotes used to escape the double quotes inside the JSON.
        - 'give <p> potion[potion_contents={potion:"minecraft:strong_swiftness"}] 1'
  hunters-wooden-sword:
    enabled: false
    commands:
      hunter:
        # Runs only once for each Hunter, with <p> replaced by their name.
        - "give <p> wooden_sword"
  full-iron-kit:
    enabled: false
    commands:
      player:
        - "give <p> stone_sword 1"
        - "give <p> iron_pickaxe 1"
        - "give <p> cooked_chicken 8"
        - "give <p> lava_bucket 1"
        - "give <p> shield 1"
        - "give <p> iron_boots 1"
        - "give <p> iron_leggings 1"
        - "give <p> iron_chestplate 1"
        - "give <p> iron_helmet 1"
  # Speedrunners get a health advantage while hunters' health gets a debuff.
  speedrunner-health-advantage:
    enabled: false
    commands:
      hunter:
        # Runs only once for each Hunter, with <p> replaced by their name.
        # Sets health to 8 full hearts for all hunters.
        - "attribute <p> minecraft:max_health base set 16"
        - "effect give <p> minecraft:instant_health 1 50 true"
      speedrunner:
        # Runs only once for each Speedrunner, with <p> replaced by their name.
        # Sets health to 15 full hearts for all speedrunners.
        - "attribute <p> minecraft:max_health base set 30"
        - "effect give <p> minecraft:instant_health 1 50 true"
      player-cleanup:
        # Runs for every participating player (only hunters and speedrunners, not including NONE)
        - "attribute <p> minecraft:max_health base set 20"
  # Sets to night permanently for the duration of the match.
  perma-night:
    enabled: false
    commands:
      console:
        # Ran by the console when the match starts.
        - "gamerule advance_time false"
        - "time set midnight"
      console-cleanup:
        # Ran by the console when the match ends.
        - "gamerule advance_time true"
  # Spawns a random mob on every speedrunner every 60 seconds.
  random-mob-spawner:
    enabled: false
    # When should commands other than cleanup be run? A list of any of:
    # ON_START - Once when the match starts (runs for all participants)
    # INTERVAL - On a fixed interval that starts counting when the game begins
    # ON_EVERY_KILL - When any participating player kills any entity (mobs included)
    # ON_PLAYER_KILL - When a participating player kills another player
    # ON_HUNTER_KILL - When a hunter kills a player
    # ON_SPEEDRUNNER_KILL - When a speedrunner kills a player
    # ON_NETHER_ENTER - When a participating player enters the Nether (once per player per match)
    # ON_END_ENTER - When a participating player enters the End (once per player per match)
    # ON_FIRST_NETHER_ENTER - When the first participating player enters the Nether (once per match)
    # ON_FIRST_END_ENTER - When the first participating player enters the End (once per match)
    # ON_EVERY_ADVANCEMENT - When a participating player earns any advancement
    # ON_RESPAWN - When a player respawns (only the executing player)
    # ON_SPEEDRUNNER_RESPAWN - When a speedrunner respawns (only the executing player)
    # ON_HUNTER_RESPAWN - When a hunter respawns (only the executing player)
    # If omitted, defaults to ON_START.
    runs-on:
      - INTERVAL
    # Only applicable when "runs-on" contains INTERVAL.
    interval-settings:
      # Interval duration in seconds.
      interval: 60
      deviation: 5
      behavior: PER_EXECUTOR
    commands:
      player:
        # <random-mob> is replaced with a random spawnable living entity type.
        # Tildes (~) are resolved to the player's position automatically.
        - "summon <random-mob> ~ ~1 ~"
  # Gives every participating player a random item every 30 seconds.
  random-item-giver:
    enabled: false
    runs-on:
      - INTERVAL
    interval-settings:
      interval: 30
      deviation: 5
      behavior: PER_EXECUTOR
    commands:
      player:
        # <random-item> is replaced with a random item type.
        - "give <p> <random-item> 1"
  # Gives a random reward to each player about every 45-75 seconds.
  gear-dice:
    enabled: false
    runs-on:
      - INTERVAL
    # Only applicable when "runs-on" contains INTERVAL.
    interval-settings:
      # Interval duration in seconds.
      interval: 15
      # Random spread in seconds. 20 and 10 means every 10 to 30 seconds.
      # Cannot go above interval. Defaults to 0.
      deviation: 5
      # PER_INVOKE shares one timer; PER_EXECUTOR gives every player and the
      # console their own timer. Defaults to PER_INVOKE.
      behavior: PER_EXECUTOR
    # Success chance for running the commands.
    # Must be between 0 and 1.0 where 1.0 means 100% chance.
    # PER_INVOKE rolls once for everyone; PER_EXECUTOR rolls for each player.
    # Ignored by cleanup commands.
    success-chance:
      chance: 0.5
      behavior: PER_EXECUTOR
    commands:
      # IN_ORDER runs every line sequentially.
      # PICK_RANDOM runs a random few instead.
      # Defaults to IN_ORDER.
      execution:
        selection: PICK_RANDOM
        pick-random:
          # How many lines to pick. Minimum 1. Defaults to 1.
          count: 1
          # PER_INVOKE picks once for everyone; PER_EXECUTOR picks separately
          # for the console and each player. Defaults to PER_INVOKE.
          behavior: PER_EXECUTOR
      player:
        - "give <p> minecraft:golden_apple 1"
        - "give <p> minecraft:golden_apple 2"
        - "give <p> minecraft:cobblestone 24"
        - "give <p> minecraft:cobblestone 32"
        - "give <p> minecraft:oak_planks 24"
        - "give <p> minecraft:oak_planks 32"
        - "give <p> minecraft:lava_bucket 1"
        - "give <p> minecraft:iron_ingot 8"
        - "give <p> minecraft:ender_pearl 1"
        - "give <p> minecraft:diamond 2"
  regen-on-kill:
    enabled: false
    runs-on:
      - ON_PLAYER_KILL
    commands:
      player:
        - "effect give <p> minecraft:regeneration 10 1 true"
  diamond-on-advancement:
    enabled: false
    runs-on:
      - ON_EVERY_ADVANCEMENT
    commands:
      player:
        - "give <p> minecraft:diamond 1"
  fireres-on-nether-enter:
    enabled: false
    runs-on:
      - ON_NETHER_ENTER
    commands:
      player:
        - "give <p> potion[potion_contents={potion:\"minecraft:fire_resistance\",custom_effects:[{id:\"minecraft:fire_resistance\",amplifier:0,duration:6000,show_particles:1b,show_icon:1b}]}] 1"
  tpall-on-end:
    enabled: false
    runs-on:
      - ON_FIRST_END_ENTER
    # Ticks to wait after triggering before this modifier's commands run.
    # Applies to start, interval, and event triggers, but not to cleanup.
    delay: 100 # delay in case speedrunner lags when loading into The End
    commands:
      speedrunner:
        - "tp @a <p>"
  # Install the Challenges addon to use this modifier.
  start-with-luckyblocks-requires-challenges-addon:
    enabled: false
    commands:
      player:
        - "give <p> sponge 24"
        - "give <p> golden_hoe 1"


# Settings that modify the game.
# These can be toggled in-game with the 'configuration' subcommand.
settings:
  # When true, every in-game config change is announced to all online
  # players except the one who made the change.
  # Default: false
  announce-config-changes: false

  # Game boosts that skew world generation and loot odds in the speedrunners'
  # favor, without touching any actual gameplay rules.
  game-boosts:
    # When true, a datapack that boosts nether structure (fortress and
    # bastion remnant) spawn frequency is applied to the world.
    # Requires a server restart to take effect.
    # Default: false
    nether-structures:
      enabled: false
    # When true, a datapack that boosts overworld structure (village,
    # shipwreck, buried treasure, dungeon, ruined portal) spawn frequency is
    # applied to the world.
    # Requires a server restart to take effect.
    # Default: false
    overworld-structures:
      enabled: false
    # Custom loot tables for things like piglin bartering.
    # Tables may be found in settings/loot-tables.
    # Loot tables are JSON files with the same format as vanilla Minecraft loot tables
    # but parsed with some limitations.
    # Toggles between custom piglin barter odds.
    # By default the custom odds have boosted up ender pearl and obsidian rates.
    # This may help in balancing the game.
    # Default: false
    custom-piglin-barter: false

  # Automatically start a match when at least one hunter and one speedrunner
  # are queued.
  # Default: false
  autostart:
    enabled: true
    # Seconds to wait before automatically running /manhunt start.
    # Set to 0 to start immediately as soon as the queue is eligible.
    countdown-seconds: 45

  # How player roles are assigned and reset around the lifecycle of a match.
  roles:
    # When true, all queued hunters/speedrunners are reset to NONE when a match
    # finishes.
    # Default: true
    reset-on-game-end:
      enabled: true
    # When true, players are reset to NONE when they leave the server.
    # (only when no game is running, otherwise they are reset to NONE on game end)
    # Default: true
    reset-on-leave:
      enabled: true
    # Controls how players with role NONE are handled when default auto-set
    # gamemode is enabled.
    # true: NONE players are put in spectator
    # false: NONE players keep their current gamemode
    # Default: true
    none-gamemode-spectator:
      enabled: true

  # Where players go when they leave a running match, voluntarily or
  # automatically: SPECTATOR keeps them at the match as a watcher, LOBBY
  # sends them back to their lobby as NONE.
  # Default: SPECTATOR
  game-leave:
    destination: SPECTATOR

  # Start the game only after a speedrunner hits a hunter.
  # Default: true
  start-on-speedrunner-damage:
    enabled: true
    # Seconds to wait for a speedrunner to hit a hunter before timing out.
    # Values below 5 are clamped to 5 seconds. Set to -1 to wait indefinitely.
    # Default: 30 seconds
    delay-seconds: 60
    # What happens if delay-seconds expires before a hit occurs:
    # CANCEL - Abort the match without recording stats.
    # FORCE_START - Force the match to start anyway.
    # Default: FORCE_START
    on-expire: FORCE_START
    # When true, all participating players are set to adventure mode during
    # the pre-start window (before a speedrunner hits a hunter). This prevents
    # breaking blocks while waiting. Players are restored to survival when the
    # game begins.
    # Default: true
    start-with-adventure-mode: true

  # Head starts that hold one role in spectator mode while the other role
  # plays. Each side is configured independently.
  headstarts:
    # Holds hunters in spectator mode at match start, giving speedrunners a
    # head start. If start-on-speedrunner-damage is also enabled, the countdown
    # only starts when a speedrunner first damages a hunter.
    # Default: false
    hunter:
      enabled: true
      # Delay in seconds. Values <= 0 mean no delay.
      # Default: 30
      delay-seconds: 30
    # Holds speedrunners in spectator mode at match start, giving hunters a
    # head start. If start-on-speedrunner-damage is also enabled, the countdown
    # only starts when a speedrunner first damages a hunter.
    # Default: false
    speedrunner:
      enabled: false
      # Delay in seconds. Values <= 0 mean no delay.
      # Default: 30
      delay-seconds: 30

  # Alternate win conditions. Multiple conditions can be enabled at the same
  # time; speedrunners win as soon as any one is satisfied.
  # Default: exit-end enabled, all others disabled
  win-conditions:
    # Conditions the speedrunners can win with.
    speedrunner:
      # Speedrunners win by entering the End and returning to the Overworld.
      exit-end:
        enabled: true
      # Speedrunners win by surviving for the configured time.
      survive-time:
        enabled: false
        # Time in seconds the speedrunner(s) must survive.
        # Default: 3600.0
        time: 3600.0
      # Speedrunners win by acquiring the configured item.
      acquire-item:
        enabled: false
        # The item to acquire (namespaced key, e.g. minecraft:netherite_ingot).
        # Default: minecraft:netherite_ingot
        item: "minecraft:netherite_ingot"
      # Speedrunners win by completing the configured advancement.
      reach-advancement:
        enabled: false
        # The advancement to reach (namespaced key, e.g. minecraft:story/enter_the_nether).
        # Default: minecraft:story/enter_the_nether
        advancement: "minecraft:story/enter_the_nether"
      # Speedrunners win when a speedrunner kills the configured mob.
      kill-mob:
        enabled: false
        # The mob to kill (namespaced key, e.g. minecraft:ender_dragon).
        # Default: minecraft:ender_dragon
        mob: "minecraft:ender_dragon"
    # Conditions the hunters can win with.
    hunter:
      # Hunters win when the time expires before the speedrunners win.
      time-limit:
        enabled: false
        # Time in seconds the speedrunners have.
        # Default: 3600.0
        time: 3600.0
      # Hunters win when a hunter acquires the configured item.
      acquire-item:
        enabled: false
        # The item to acquire (namespaced key, e.g. minecraft:netherite_ingot).
        # Default: minecraft:netherite_ingot
        item: "minecraft:netherite_ingot"
      # Hunters win when a hunter kills the configured mob.
      kill-mob:
        enabled: false
        # The mob to kill (namespaced key, e.g. minecraft:ender_dragon).
        # Default: minecraft:ender_dragon
        mob: "minecraft:ender_dragon"

  # Compass tracking settings. The held actionbar stays visible between
  # interval refreshes and continues showing its cached value.
  compass:
    # Which roles receive a compass when a match starts (and on respawn).
    # Hunters track speedrunners; speedrunners track hunters.
    # Set both to false to disable the compass entirely.
    # Default: hunters true, speedrunners false
    given-to:
      hunters: true
      speedrunners: false
    # The item handed out as the tracking compass, in modern
    # minecraft:material_name format (the minecraft: namespace may be
    # omitted). Try "clock" or "recovery_compass" for a different look.
    # Anything unknown, or anything with placement functionality such as
    # dirt, signs, or redstone, falls back to "compass".
    # Default: compass
    item: compass
    # When true, the hunter compass must stay in the player's inventory and
    # cannot be dropped or placed in chests. When false, the compass behaves
    # like a normal item and can be dropped or stored.
    # The compass always defaults to the last hotbar slot when given, but is
    # not locked to that slot. The player can freely move it within their
    # inventory.
    # Default: true
    must-be-inventory:
      enabled: true
    # When true, a compass survives a speedrunner's death as a normal dropped
    # item.
    # If a speedrunner gets ahold of the compass, they may track the hunters.
    # Default: true
    drop-on-death:
      enabled: true
    # Seconds between compass target/location refreshes. Set to -1 to disable
    # scheduled refreshes (in that case use right-click refresh or the compass
    # NEVER refreshes); right-click refreshes can still be used separately.
    refresh-interval: 10.0
    right-click:
      # Optional refresh-on-right-click runs alongside interval refreshes.
      refresh-on-right-click: true
      # Seconds between right-click refreshes. Set to -1 for no cooldown.
      right-click-cooldown: 3.0
    analyze:
      # Purposeful lag before a compass refresh resolves, showing
      # "Analyzing..." while it runs. No second refresh starts mid-analysis,
      # and click cooldowns restart when the analysis ends.
      # Applies to right-click refreshes.
      # Default: false
      right-click: false
      # Applies to automatic (interval) refreshes.
      # Default: false
      auto: false
      # Seconds the analysis takes before the compass updates.
      # Default: 1.0
      delay-seconds: 1.0
      # Commands run as console when an analysis starts, in custom-modifier
      # style: <p> is the holder, ~ resolves against their location, and
      # <duration> is the analysis delay in whole seconds (floored). The
      # player list runs for every analyzing holder plus their own role
      # list. Only participants are affected.
      # Default: false
      debuffs:
        enabled: false
        commands:
          player:
            - "effect give <p> minecraft:slowness <duration> 1 true"
          speedrunner: []
          hunter: []
    # When true, the compass stops tracking when the targeted player is within
    # the configured flat distance. Only X/Z coordinates are compared, so the
    # target may still be above or below the holder. Applies to both hunters
    # and speedrunners who got ahold of the compass.
    # Default: true
    disable-when-nearby:
      enabled: true
      # The flat distance in blocks at which the compass stops tracking.
      # Default: 25
      distance: 25.0
    # Maximum distance at which the compass can track a player. When the target
    # is beyond this distance the compass shows an out-of-range actionbar
    # instead of pointing at the target.
    # Set to -1 for unlimited distance.
    # Default: -1
    tracking-distance: -1.0

  # Friendly fire rules for participants. When disabled for a role, players of
  # that role cannot damage players of the same role once the game has begun.
  # Friendly fire is never active during the pre-start window.
  # Default: true for both
  friendly-fire:
    speedrunner: true
    hunter: true

  # Delayed hunter respawn and per-role lives.
  hunter-respawn:
    # When true, deceased hunters wait before respawning instead of respawning
    # immediately.
    # Default: false
    enabled: true
    # Seconds a hunter must wait before respawning after death.
    # Set to -1 for no delay (respawn immediately).
    # Default: 60
    delay-seconds: 15
    # Lives per role. A player is eliminated when their lives run out.
    # Set to -1 for unlimited lives.
    # Default: one speedrunner life, unlimited hunter lives.
    lives:
      speedrunner: 1
      hunter: -1

  # Optional effects applied to every hunter when the game begins. Effect keys
  # are Bukkit PotionEffectType names. Duration is in seconds and amplifier is
  # zero-based: amplifier 0 is level I, amplifier 1 is level II.
  # You may find a list of effect names here:
  # https://hub.spigotmc.org/javadocs/spigot/org/bukkit/potion/PotionEffectType.html
  # Default: false
  start-debuffs:
    enabled: false
    effects:
      SLOWNESS:
        seconds: 10.0
        amplifier: 1
      WEAKNESS:
        seconds: 10.0
        amplifier: 0

  # Invulnerability settings.
  invulnerability:
    # Makes all online players invulnerable when the game ends.
    # Invulnerability is removed when the next match starts.
    # Default: true
    on-game-end:
      enabled: true
    # Makes players with role NONE (spectators) invulnerable at all times.
    # Default: true
    none-players:
      enabled: true

  # Announces each participant's role when a match starts, in chat and/or as a
  # title. Both are toggled independently; when both are off, no announcement
  # (including sounds) plays.
  # Default: both enabled
  announce-roles:
    chat:
      enabled: true
    title:
      enabled: true
      # Title timing in seconds.
      fade-in-seconds: 0.5
      stay-seconds: 3.0
      fade-out-seconds: 0.5

  # Optional /manhunt status extras. Each toggles independently.
  status:
    # Show "Speedrunners win on ..." and "Hunters win on ..." lines.
    # Default: false
    show-win-conditions: false
    # Show how long the match has been running.
    # Default: false
    show-elapsed-time: false
    # Show lobby and game ids as L{lobby}|G{game}.
    # Default: true
    show-ids: true

  # Rolling anti-spawn-camp guard: too many kills by one attacker on the
  # same victim inside the window punishes the camper, broadcast to all.
  anti-spawn-camp:
    # Default: true
    enabled: true
    # Kills on the same victim that trigger the punishment.
    # Default: 3
    kills: 3
    # Rolling window in seconds.
    # Default: 120.0
    window-seconds: 120.0
    # Punishment: KILL slays the camper, GEAR-WIPE clears their armor,
    # offhand, and main hand.
    # Default: KILL
    punishment: KILL


# Grid-based single-world manhunt engine.
# Uses persistent square-spiral cell indexing and teleports participants to
# randomized points near each cell center.
# Avoids manual world restarting entirely.
#
# Setting this to true will additionally modify stronghold generation,
# such that to bypass the 128-per-world limit and spread them around
# like normal structures. You can tweak the rates in
# settings/world-engine/strongholds.json.
# Default: false
world-engine:
  enabled: false
  world-name: world
  # Name of the lobby world used by /manhunt worldengine tpto lobbyworld.
  # When no world with this name exists, the plugin generates a void world
  # filled by the configured lobby preset on confirmed request. Point this
  # at your own world to use it instead.
  # Default: jmh-lobby
  lobby-world-name: "jmh-lobby"
  # Teleport players who fall into the void in the lobby world back to their
  # lobby location (or lobby 0 when theirs is unset). Never applies in the
  # game world.
  # Default: true
  lobby-world-void-rescue: true
  # Preset applied when the lobby world is generated. Delete the world
  # folder and run tpto twice to regenerate with another preset.
  # Default: DEFAULT
  lobby-preset: DEFAULT
  # Per-preset generation. schematic is a vanilla structure-block .nbt in
  # JManhunt/settings/world-engine/lobby-schematics/, pasted with its
  # midpoint at 0,64,0. commands run as console after the paste and before
  # the first teleport lands ({world} and {preset} are substituted).
  # Do not touch unless you know what you are doing.
  lobby-presets:
    EMPTY:
      schematic: "empty-lobby"
      commands: []
    DEFAULT:
      schematic: "default-lobby"
      commands: []
    ADVANCED:
      schematic: "advanced-lobby"
      commands: []
  # Stand-on role pads. A player in the lobby world inside a listed block's
  # XZ cell and at most 4 blocks above it is assigned the mapped role,
  # like setplayer. Material names are Bukkit Material names.
  # Default: true
  role-pads:
    enabled: true
    speedrunner: LIME_CONCRETE
    hunter: RED_CONCRETE
    afk: YELLOW_CONCRETE
    spectator: LIGHT_GRAY_CONCRETE
    none: GRAY_CONCRETE
  # Lobby locations per lobby id. Players return to their match's lobby
  # location when a game ends. Preferably set to something different from the
  # world that the spiral engine works on.
  lobby-locations:
    "0":
      world: world
      x: 0.5
      y: 100.0
      z: 0.5
      yaw: 0.0
      pitch: 0.0
  # Size of one spiral cell in blocks. Hard-capped at 50,000.
  # Too low values may cause issues.
  # Default: 10,000
  cell-size: 10000
  # Radius from each cell center used when selecting player's spawn points.
  # Hard-capped at cell-size / 2.
  # Default: 5
  tp-spread-radius: 5
  # When true, the spawn point algorithm is used to find a valid spawn point
  # for each player. This fixes spawning inside oceans or lava, but can
  # sometimes cause server lag.
  # Default: true
  use-spawnpoint-algorithm: true
  # Cell preloading. Console commands run whenever new cells are fetched, and
  # a buffer of ready cells is kept so matches start without lag.
  preloading:
    # Optional console commands run whenever a new cell is fetched for a
    # match. <cellX> and <cellZ> are replaced with the cell's block
    # coordinates. This is useful for chunk-generation plugins such as Chunky
    # to pre-generate the cell area before players teleport in.
    # Try something like:
    #      - chunky world world
    #      - chunky center <cellX> <cellZ>
    #      - chunky radius 120
    #      - chunky start
    #      - chunky confirm
    commands: []
    # Ready-cell buffer kept ahead of match starts.
    cell-buffer:
      # How many pregenerated cells to keep ready. Minimum: 1.
      # Default: 1
      stored-cells-buffer: 1
      # When the buffer refills: ALWAYS refills whenever a slot is free,
      # NO_MATCH_RUNNING only refills while no match is running.
      # Default: ALWAYS
      increment-when: ALWAYS
  # When extra end dimensions beyond the cell buffer are deleted. ALWAYS
  # prunes one extra dimension per match start until the buffer is reached,
  # NEVER keeps extra dimensions around.
  # Default: NEVER
  end-cell-prune-when: NEVER
  # World border configuration for cell confinement.
  world-border:
    # When true, the world border is used to limit the spiral cell area.
    # It enforces the boundary between cells and prevents entering
    # unused or already used cells. It works in both overworld and
    # nether.
    #
    # This setting should only be used when the game world is different
    # from the lobby world. Otherwise lobby players may suffocate.
    # Default: true
    enabled: true
    # The buffer (in blocks), after which the player is dealt damage.
    damage:
      # The size of the world border buffer in blocks.
      # Default: 5.0
      buffer: 5.0
      # Damage dealt per block per second when outside the buffer.
      # Default: 1.0
      amount: 1.0
    # A smaller initial border that expands to cell size when the game
    # begins. Only active when world-border.enabled is true AND
    # start-on-speedrunner-damage.enabled is true.
    start-border:
      # Enables the start border feature.
      # Default: true
      enabled: true
      # Initial border radius in blocks. The actual diameter used is
      # max(this, tp-spread-radius + 1) * 2, ensuring players never
      # spawn outside the border.
      # Set to -1 to use tp-spread-radius + 1 only.
      # Default: 10
      radius: 10
      # Time in seconds for the start border to animate expanding to
      # cell size when the game begins.
      # Set to 0 or -1 to skip the animation and snap to cell size
      # immediately.
      # Default: 5
      fadeout-time: 5


# Sound names are namespaced Minecraft keys.
# eg. block.note_block.pling
# It's recommended to use a sound explorer like
# https://mudkipdev.github.io/minecraft-sound-explorer/
sounds:
  neutral-sound:
    enabled: true
    sound: block.note_block.pling
    pitch: 1.0
    volume: 1.0

  game:
    # Runs on autostart countdown and hunter spawn countdown
    autostart-countdown:
      enabled: true
      sound: block.stone_button.click_on
      pitch: 2.0
      volume: 1.0
    # Runs on speedrunner killed (by any means)
    speedrunner-death:
      enabled: true
      sound: block.trial_spawner.detect_player
      pitch: 1.2
      volume: 1.0
    # Runs on hunter killed (by any means)
    hunter-death:
      enabled: true
      sound: entity.player.hurt_sweet_berry_bush
      pitch: 0.9
      volume: 1.0
    # Runs when speedrunners win
    win-sound:
      enabled: true
      sound: entity.ender_dragon.death
      pitch: 1.0
      volume: 1.0
    # Runs when hunters win
    fail-sound:
      enabled: true
      sound: entity.wither.spawn
      pitch: 1.0
      volume: 1.0
    # Runs when a match is canceled
    cancelled-sound:
      enabled: true
      sound: block.bubble_column.whirlpool_ambient
      pitch: 0.9
      volume: 1.0
  # Per-role sounds for the start-of-match role announcement. Each participant
  # hears their own role's sound.
  announce:
    # Heard by each hunter when roles are announced.
    hunter:
      enabled: true
      sound: entity.wither.break_block
      pitch: 1.3
      volume: 0.8
    # Heard by each speedrunner when roles are announced.
    speedrunner:
      enabled: true
      sound: block.copper_chest.close
      pitch: 1.0
      volume: 1.0
    # Heard by each spectator when roles are announced.
    spectator:
      enabled: true
      sound: block.note_block.chime
      pitch: 1.0
      volume: 0.8
