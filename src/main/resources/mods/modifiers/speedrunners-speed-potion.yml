# Bundled JManhunt modifier: speedrunners-speed-potion
enabled: false
meta:
  name: "Speedrunner Swiftness"
  description: "Speedrunners start with a strong swiftness potion"
  item: POTION
  author: JManhunt
behavior:
  0:
    commands:
      speedrunner:
        # Runs only once for each Speedrunner, with <p> replaced by their name.
        # Note the single quotes used to escape the double quotes inside the JSON.
        - 'give <p> potion[potion_contents={potion:"minecraft:strong_swiftness"}] 1'
