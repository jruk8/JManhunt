# Bundled JManhunt modifier: full-iron-kit
# A semi-op kit for speedrunners to start with.
enabled: false
meta:
  name: "Speedrunners Starter Kit"
  description: "Full leather armor and a few other items"
  item: LEATHER_HELMET
  author: JManhunt
behavior:
  0:
    commands:
      player:
        - "give <p> wooden_sword 1"
        - "give <p> iron_pickaxe 1"
        - "give <p> cooked_chicken 8"
        - "give <p> lava_bucket 1"
        - "give <p> shield 1"
        - "give <p> leather_boots 1"
        - "give <p> leather_leggings 1"
        - "give <p> leather_chestplate 1"
        - "give <p> leather_helmet 1"
