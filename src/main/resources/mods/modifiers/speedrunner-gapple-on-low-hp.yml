# Bundled JManhunt modifier: speedrunner-gapple-on-low-hp
# A golden apple for weak speedrunners, at most every five minutes.
# The flag stamps the last give; exit skips the rest while cooling down.
enabled: false
meta:
  name: "Gapple On Low HP"
  description: "A golden apple for low HP runners, at most every 5 minutes"
  item: GOLDEN_APPLE
  author: JManhunt
behavior:
  0:
    runs-on:
      - INTERVAL
    options:
      interval-settings:
        interval: 2.0
    commands:
      speedrunner:
        - '<if:"<phasitem:<p>,golden_apple> == true","exit">'
        - '<if:"<pstat:<p>,health> le 7 and <gstat:duration>-<default:<pflag:lastuse-<id>>,-999999> gt 300","give <p> golden_apple","exit">'
        - "<pflag:lastuse-<id>,<gstat:duration>>"
