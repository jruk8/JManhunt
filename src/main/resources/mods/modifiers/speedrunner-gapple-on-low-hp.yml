# Bundled JManhunt modifier: speedrunner-gapple-on-low-hp
# A golden apple for weak speedrunners, at most every five minutes.
# Lines exit cheapest-first; the gate stamps itself only when reached,
# so the timer starts only on an actual give.
enabled: false
meta:
  name: "Gapple On Low HP"
  description: "A golden apple for low HP runners, at most every 5 minutes"
  item: GOLDEN_APPLE
  author: JManhunt
behavior:
  0:
    runs-on:
      - INTERVAL
    options:
      interval-settings:
        interval: 2.0
    commands:
      speedrunner:
        - '<if:"<pcooldown.get:<p>,<id>,300> gt 0","exit">'
        - '<if:"<pstat:<p>,health> gt 7","exit">'
        - '<if:"<phasitem:<p>,golden_apple> == true","exit">'
        - '<if:"<pcooldown:<p>,<id>,300> == true","give <p> golden_apple","exit">'
