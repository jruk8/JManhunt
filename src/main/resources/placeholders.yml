# JManhunt's built-in PlaceholderAPI identifiers.
# All placeholders must be used with the prefix %jmanhunt_<placeholder>%
# (e.g. %jmanhunt_total_kills%, %jmanhunt_time_as_hunter%).
# Formatting, aliases, and enabled/disabled state are configured in config.yml.
# Values are resolved for the player passed by PlaceholderAPI.
placeholders:
  time_as_speedrunner:
    type: LONG
    description: Career time played as a speedrunner, in milliseconds.
  time_as_hunter:
    type: LONG
    description: Career time played as a hunter, in milliseconds.
  formatted_time_as_speedrunner:
    type: TEXT
    description: Career speedrunner time formatted as days, hours, minutes, seconds.
  formatted_time_as_hunter:
    type: TEXT
    description: Career hunter time formatted as days, hours, minutes, seconds.
  total_kills:
    type: INTEGER
    description: Career total kills.
  total_kills_as_hunter:
    type: INTEGER
    description: Career kills while playing as a hunter.
  total_kills_as_speedrunner:
    type: INTEGER
    description: Career kills while playing as a speedrunner.
  total_final_kills:
    type: INTEGER
    description: Career final kills.
  total_damage_dealt:
    type: DECIMAL
    description: Career damage dealt in hearts.
  total_wins_as_hunter:
    type: INTEGER
    description: Career wins as a hunter.
  total_wins_as_speedrunner:
    type: INTEGER
    description: Career wins as a speedrunner.
  total_game_sessions:
    type: INTEGER
    description: Career total matches played as a participant.
  sessions_as_speedrunner:
    type: INTEGER
    description: Career matches played as a speedrunner.
  sessions_as_hunter:
    type: INTEGER
    description: Career matches played as a hunter.
  formatted_total_playtime:
    type: TEXT
    description: Career total playtime (speedrunner + hunter) formatted as days, hours, minutes, seconds.
  total_kd_as_speedrunner:
    type: DECIMAL
    description: Career K/D ratio as a speedrunner (kills per session).
  total_kd_as_hunter:
    type: DECIMAL
    description: Career K/D ratio as a hunter (kills per session).
