# JManhunt interactive setup tutorial (/mh setup).
#
# Nodes form a graph: every answer names the next node id, EXIT to close
# the tutorial, or HELP_EXIT to run mh help and then close. Going back is
# automatic from the visit stack; 'b' on the first dialogue quits like 'q'.
#
# Answer commands run as the player through /mh, so normal permission
# checks apply. Nothing here runs as the console.
format:
  header:
    - "<white>Welcome to the interactive setup for {logo}."
    - "This system aims to help you quickly start using the plugin."
  question: "<#de7766>{step}.</#de7766> {question}"
  answer: "{number} <green>»</green> {recommendation}{notrecommended}{answer}"
  separator: "<gray>--**--**--**--**--**--**--**--**--</gray>"
  footer: "<gray>(type answer number to continue, b to go back, or q to quit)"
  recommendation: "<yellow>(recommended)</yellow> "
  notrecommended: "<red>(not recommended)</red> "
sounds:
  congratulations:
    enabled: true
    id: "entity.player.levelup"
    volume: 1.0
    pitch: 0.8
messages:
  invalid: "{prefix}<gray>Type a number or type 'q' to quit the setup."
  timeout: "{prefix}<yellow>Setup timed out after 5 minutes of no answers."
  quit: "{prefix}<gray>Setup closed. Run <white>/mh setup<gray> any time to restart."
  broken: "{prefix}<red>Setup is broken: tell an admin to check Core/tutorial.yml."
nodes:
  start:
    question:
      - "What would you like to do?"
    answers:
      - text: "Set up JManhunt as a first-timer. <gray>(~3 minutes)</gray>"
        next: "setup_root"
      - text: "Use Modifiers to juice up the game. <gray>(~3 minutes)</gray>"
        next: "mod_intro"
      - text: "Customize the Compass. <gray>(~8 minutes)</gray>"
        next: "compass_intro"
      - text: "Talk to us on Discord."
        next: "discord"
      - text: "Learn about the plugin. <gray>(instant)</gray>"
        next: "HELP_EXIT"
  setup_root:
    question:
      - "Let's get started. What is your goal?"
    answers:
      - text: "Classic Manhunts with World Engine and a fully automated lobby. <gray>(3 minutes)</gray>"
        recommended: true
        commands:
          - "jmanhunt:mh config world-engine enabled true"
        next: "we_lobby"
      - text: "Classic Manhunts with no world resets. <gray>(instant)</gray>"
        notrecommended: true
        next: "nr_start"
  we_lobby:
    question:
      - "World Engine is now enabled. Restart the server soon for all features to apply."
      - "<#de7766>Next:</#de7766> generate the lobby. Pick one preset."
    answers:
      - text: "Create the DEFAULT lobby: one lobby with baskets."
        recommended: true
        commands:
          - "jmanhunt:mh worldengine tpto lobbyworld @s DEFAULT"
          - "jmanhunt:mh worldengine tpto lobbyworld @s DEFAULT"
        next: "we_teleport"
      - text: "Create the ADVANCED lobby: three lobbies, each with baskets."
        commands:
          - "jmanhunt:mh worldengine tpto lobbyworld @s ADVANCED"
          - "jmanhunt:mh worldengine tpto lobbyworld @s ADVANCED"
        next: "we_teleport"
      - text: "Create an EMPTY plot: nothing prebuilt."
        notrecommended: true
        commands:
          - "jmanhunt:mh worldengine tpto lobbyworld @s EMPTY"
          - "jmanhunt:mh worldengine tpto lobbyworld @s EMPTY"
        next: "we_teleport"
  we_teleport:
    question:
      - "Done. Everyone joins the hunt from the lobby world."
      - "This command teleports all players there: <gray>/mh worldengine tpto lobbyworld @a</gray>"
      - "Run it now so everyone teleports there right away?"
    answers:
      - text: "Yes, teleport everyone now."
        recommended: true
        commands:
          - "jmanhunt:mh worldengine tpto lobbyworld @a"
        next: "we_done"
      - text: "No, I will do it later."
        next: "we_done"
  we_done:
    celebrate: true
    question:
      - "That is basically it. Walk onto the baskets (colored concrete blocks) to pick <#de666e>Hunter</#de666e> or <#74de66>Speedrunner</#74de66>, then start with <gray>/mh start</gray> or wait for autostart."
      - "Remember to restart the server so World Engine fully applies."
      - "Want to go further?"
    answers:
      - text: "Learn about Modifiers."
        next: "mod_intro"
      - text: "Learn about the Compass."
        next: "compass_intro"
      - text: "Learn the /mh config command."
        next: "cfg_intro"
      - text: "Exit the setup."
        next: "EXIT"
  nr_start:
    question:
      - "No resets, no problem. How do you want to start matches?"
    answers:
      - text: "Start with one random <#74de66>speedrunner</#74de66>. <gray>(instant)</gray>"
        recommended: true
        next: "nr_qs"
      - text: "Pick who plays what myself. <gray>(1 minute)</gray>"
        next: "nr_manual"
  nr_qs:
    question:
      - "Use <white>/mh qs</white>: it shuffles everyone into <#de666e>hunters</#de666e> plus one random <#74de66>speedrunner</#74de66> and starts instantly."
      - "Where to next?"
    answers:
      - text: "Learn to pick roles manually."
        next: "nr_manual"
      - text: "Learn more about quickstart."
        next: "nr_qs_more"
      - text: "Set up World Engine lobbies instead."
        recommended: true
        commands:
          - "jmanhunt:mh config world-engine enabled true"
        next: "we_lobby"
      - text: "Exit the setup."
        next: "EXIT"
  nr_qs_more:
    question:
      - "<white>/mh qs [percentage]</white> sets how many players become <#74de66>speedrunners</#74de66>. <white>/mh qs 50</white> splits the lobby in half."
      - "Without a percentage you get exactly one <#74de66>speedrunner</#74de66>."
    answers:
      - text: "Learn to pick roles manually."
        next: "nr_manual"
      - text: "Set up World Engine lobbies instead."
        recommended: true
        commands:
          - "jmanhunt:mh config world-engine enabled true"
        next: "we_lobby"
      - text: "Exit the setup."
        next: "EXIT"
  nr_manual:
    question:
      - "Use <white>/mh setplayer @a hunter</white>: any selector plus a role (<#de666e>hunter</#de666e>, <#74de66>speedrunner</#74de66>, spectator, afk, none). Then <white>/mh start</white>."
    answers:
      - text: "Learn about quickstart instead."
        next: "nr_qs"
      - text: "Set up World Engine lobbies instead."
        recommended: true
        commands:
          - "jmanhunt:mh config world-engine enabled true"
        next: "we_lobby"
      - text: "Exit the setup."
        next: "EXIT"
  mod_intro:
    question:
      - "Modifiers are ready-made game twists you can switch on or off."
      - "For example, <white>everyone-gets-beef</white> hands every player 8 steaks when the match starts."
    answers:
      - text: "Show me the fun ones to turn on."
        recommended: true
        next: "mod_fun"
      - text: "How do I turn them on and off?"
        next: "mod_toggle"
      - text: "How do I make my own?"
        next: "mod_create"
      - text: "Get community modifiers on Discord."
        next: "discord"
      - text: "Exit the setup."
        next: "EXIT"
  mod_fun:
    question:
      - "Pick n' mix! Note that this setup does not support disabling modifiers <gray>(disable with /mh modifiers setmod NAME false)</gray>."
    answers:
      - text: "Speedrunners get a speed potion."
        commands:
          - "jmanhunt:mh modifiers setmod speedrunners-speed-potion enabled true"
        next: "mod_fun"
      - text: "Everyone starts with an iron kit."
        commands:
          - "jmanhunt:mh modifiers setmod full-iron-kit enabled true"
        next: "mod_fun"
      - text: "Killers regenerate health."
        commands:
          - "jmanhunt:mh modifiers setmod regen-on-kill enabled true"
        next: "mod_fun"
      - text: "A diamond for every advancement."
        commands:
          - "jmanhunt:mh modifiers setmod diamond-on-advancement enabled true"
        next: "mod_fun"
      - text: "A random mob visits the runners."
        commands:
          - "jmanhunt:mh modifiers setmod random-mob-spawner enabled true"
        next: "mod_fun"
      - text: "A random item for everyone."
        commands:
          - "jmanhunt:mh modifiers setmod random-item-giver enabled true"
        next: "mod_fun"
      - text: "<yellow>Back to modifiers.</yellow>"
        next: "mod_intro"
  mod_toggle:
    question:
      - "Run <gray>/mh modifiers</gray> to browse every modifier in a menu."
      - "Or switch one from chat with <gray>/mh modifiers setmod NAME true</gray>, or <gray>false</gray> to switch it off."
      - "Example: <gray>/mh modifiers setmod everyone-gets-beef true</gray>"
    answers:
      - text: "Show me the fun ones."
        recommended: true
        next: "mod_fun"
      - text: "How do I make my own?"
        next: "mod_create"
      - text: "Back to modifiers."
        next: "mod_intro"
      - text: "Exit the setup."
        next: "EXIT"
  mod_create:
    question:
      - "Open <gray>modifiers.yml</gray>, copy the <white>everyone-gets-beef</white> block, rename it, and change its behavior. Save, then run <white>/mh reload</white>."
      - "Stuck? Grab ready-made ones from the community."
    answers:
      - text: "Get community modifiers on Discord."
        recommended: true
        next: "discord"
      - text: "Back to modifiers."
        next: "mod_intro"
      - text: "Exit the setup."
        next: "EXIT"
  compass_intro:
    question:
      - "<#de666e>Hunters</#de666e> track <#74de66>speedrunners</#74de66> with the compass. Under <gray>settings.compass.given-to</gray> you can hand both roles one."
      - "The compass has plenty of options. You can read about them in the config file."
    answers:
      - text: "What can the compass do other than the basic stuff?"
        next: "compass_detail"
      - text: "Learn the /mh config command."
        next: "cfg_intro"
      - text: "Exit the setup."
        next: "EXIT"
  compass_detail:
    question:
      - "Right-click refreshes the target, left-click cycles it. Tune min and max distance, lock behavior, and signal interference under <gray>settings.compass</gray>."
    answers:
      - text: "Learn about Modifiers."
        next: "mod_intro"
      - text: "Learn the /mh config command."
        next: "cfg_intro"
      - text: "Back to the main menu."
        next: "start"
      - text: "Exit the setup."
        next: "EXIT"
  cfg_intro:
    question:
      - "<white>/mh config</white> browses every setting in-game: each word drills one level deeper. A section lists its keys; a leaf shows its value, plus a value to set it."
      - "Example: <white>/mh config world-engine enabled true</white> (needs a restart)."
      - "Modifiers work the same way: <white>/mh config modifiers everyone-gets-beef enabled true</white>"
    answers:
      - text: "Learn about Modifiers."
        next: "mod_intro"
      - text: "Learn about the Compass."
        next: "compass_intro"
      - text: "Get help on Discord."
        next: "discord"
      - text: "Back to the main menu."
        next: "start"
      - text: "Exit the setup."
        next: "EXIT"
  discord:
    question:
      - "<click:open_url:'https://discord.gg/hkWmCVmWDC'><#5865F2><underlined>Click to join Discord</underlined></#5865F2></click> for community modifiers and setup help."
    answers:
      - text: "Back to menu."
        next: "start"
      - text: "Exit the setup."
        next: "EXIT"
