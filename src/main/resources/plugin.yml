name: ${name}
version: ${version}
main: ${main}
api-version: "${apiVersion}"
author: ${author}
description: ${description}
website: ${website}
softdepend:
  - PlaceholderAPI
libraries:
  - org.postgresql:postgresql:42.7.7
  - org.xerial:sqlite-jdbc:3.50.3.0
  - com.zaxxer:HikariCP:6.3.0

commands:
  manhunt:
    description: Manage a Manhunt match.
    usage: /manhunt help
    aliases: [mh]

permissions:
  jmanhunt.command.help:
    description: Use /manhunt help.
    default: true
  jmanhunt.command.status:
    description: View the current Manhunt status.
    default: true
  jmanhunt.command.challenges:
    description: Show info about the optional JManhunt Challenges addon.
    default: true
  jmanhunt.command.setplayer:
    description: Assign players to Manhunt roles.
    default: op
  jmanhunt.command.setplayer.self:
    description: Assign your own Manhunt role.
    default: op
  jmanhunt.command.start:
    description: Start a Manhunt match.
    default: op
  jmanhunt.command.end:
    description: End an active Manhunt match.
    default: op
  jmanhunt.command.reload:
    description: Reload JManhunt configuration.
    default: op
  jmanhunt.command.config:
    description: View or change configuration by category.
    default: op
  jmanhunt.command.modifiers:
    description: View and toggle gameplay modifiers.
    default: op
  jmanhunt.command.worldengine:
    description: View world-engine settings.
    default: op
  jmanhunt.command.worldengine.lobbyconfig:
    description: Manage lobby teleports, bounds, and entries.
    default: op
  jmanhunt.command.worldengine.tpto:
    description: Teleport to the lobby world or game world.
    default: op
  jmanhunt.command.worldengine.cellindex:
    description: View or change the world-engine cell index.
    default: op
  jmanhunt.command.quickstart:
    description: Quick-start a match.
    default: op
  jmanhunt.command.debug:
    description: Toggle JManhunt debug output.
    default: op
  jmanhunt.command.dev.schem:
    description: Use the developer schematic tools (/manhunt dev schem).
    default: op
  jmanhunt.command.lobby:
    description: Manage lobby queues.
    default: op
  jmanhunt.command.game:
    description: Join players to or remove them from a running match.
    default: op
  jmanhunt.command.setup:
    description: Use the interactive setup tutorial (/manhunt setup).
    default: op
  jmanhunt.admin:
    description: Receive plugin update notices and other admin messages.
    default: op
  jmanhunt.hunter:
    description: Allows a player to become a hunter.
    default: true
  jmanhunt.speedrunner:
    description: Allows a player to become a speedrunner.
    default: true
  jmanhunt.afk:
    description: Allows a player to become afk.
    default: true
  jmanhunt.none:
    description: Allows a player to become unassigned (none).
    default: true
  jmanhunt.spectator:
    description: Allows a player to become a spectator.
    default: true
