site_name: JManhunt
site_description: A deeply configurable Paper plugin for Manhunts.
site_url: https://jruk8.github.io/JManhunt/
repo_url: https://github.com/jruk8/JManhunt
repo_name: jruk8/JManhunt

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - social
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Gallery: gallery.md
  - Commands: commands.md
  - Permissions: permissions.md
  - Configuration:
      - Overview: configuration.md
      - Settings:
          - Overview: configuration/settings.md
          - Match Start & End: configuration/settings/match-start-end.md
          - Compass Tracking: configuration/settings/compass-tracking.md
          - Roles: configuration/settings/roles.md
          - Win Conditions & End Screen: configuration/settings/win-conditions-end-screen.md
          - Game Boosts: configuration/settings/game-boosts.md
      - World Engine:
          - Overview: configuration/world-engine.md
          - Cells & Spawns: configuration/world-engine/cells-spawns.md
          - Pre-generating Cells: configuration/world-engine/pregenerating-cells.md
          - Borders: configuration/world-engine/borders.md
          - Troubleshooting: configuration/world-engine/troubleshooting.md
      - Custom Modifiers: configuration/modifiers.md
      - Built-in Match Commands: configuration/match-commands.md
      - Statistics & PlaceholderAPI: configuration/statistics.md
      - Sounds: configuration/sounds.md
  - Placeholders: placeholders.md
  - API: api.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jruk8/JManhunt