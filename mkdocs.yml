site_name: JManhunt
site_description: 🧭 Highly customizable Manhunt plugin for 26.2-26.3+ with compass tracking, modifiers, and an automated world reset engine.
site_url: https://jruk8.github.io/JManhunt/
repo_url: https://github.com/jruk8/JManhunt
repo_name: jruk8/JManhunt

theme:
  name: material
  language: en
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - announce.dismiss
    - social
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Getting Started: getting-started.md
  - Gallery: gallery.md
  - Donate: donate.md
  - Play:
      - Lobby System:
          - Overview: play/lobby-system/index.md
          - Multi-Lobby Boundaries: play/lobby-system/boundaries.md
      - Concurrent Matches: play/concurrent-matches.md
      - Spectating: play/spectating.md
      - Commands: play/commands.md
      - Admin GUI: play/gui.md
  - Configuration:
      - Overview: configuration.md
      - Settings:
          - Overview: configuration/settings.md
          - Match Start & End: configuration/settings/match-start-end.md
          - Compass Tracking: configuration/settings/compass-tracking.md
          - Compass Advanced: configuration/settings/compass-advanced.md
          - Roles: configuration/settings/roles.md
          - Win Conditions & End Screen: configuration/settings/win-conditions-end-screen.md
          - Game Boosts: configuration/settings/game-boosts.md
      - World Engine:
          - Overview: configuration/world-engine.md
          - Cells & Spawns: configuration/world-engine/cells-spawns.md
          - Preloading Cells: configuration/world-engine/preloading-cells.md
          - Borders: configuration/world-engine/borders.md
          - End Dimensions: configuration/world-engine/end-dimensions.md
          - Pseudoborder Particles: configuration/world-engine/pseudoborder-particles.md
          - Troubleshooting: configuration/world-engine/troubleshooting.md
      - Modifiers:
          - Overview: configuration/modifiers.md
          - Your First Modifier: configuration/modifiers/first-modifier.md
          - Creating: configuration/modifiers/creating.md
          - Behaviors: configuration/modifiers/behaviors.md
          - Tags Basics: configuration/modifiers/tags-basics.md
          - Tags Advanced: configuration/modifiers/tags-advanced.md
      - Game Rules: configuration/game-rules.md
      - Statistics: configuration/statistics.md
      - Sounds: configuration/sounds.md
  - Advanced:
      - Permissions: advanced/permissions.md
      - Placeholders: advanced/placeholders.md
      - API: advanced/api.md
      - Developer Tools: advanced/dev-tools.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jruk8/JManhunt