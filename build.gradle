plugins {
    id 'java'
    id 'checkstyle'
    id 'com.gradleup.shadow' version '9.0.0'
}

group = project.property('pluginGroup')
version = project.property('pluginVersion')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven {
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${paperApiVersion}"
    compileOnly 'me.clip:placeholderapi:2.11.6'

    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
    implementation 'org.postgresql:postgresql:42.7.7'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

checkstyle {
    toolVersion = '10.17.0'
    configFile = file('config/checkstyle/checkstyle.xml')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs += '-Xlint:deprecation'
}

shadowJar {
    archiveClassifier.set('')
    relocate 'org.sqlite', 'com.jruk8.jmanhunt.lib.sqlite'
    relocate 'org.postgresql', 'com.jruk8.jmanhunt.lib.postgresql'
}

tasks.named('build') { dependsOn tasks.named('shadowJar') }

test {
    useJUnitPlatform()
}

check {
    dependsOn 'checkstyleMain', 'checkstyleTest'
}

processResources {
    def pluginProperties = [
        version: project.version,
        name: pluginName,
        main: pluginMain,
        apiVersion: paperApiVersion.split('\\.build\\.')[0],
        author: pluginAuthor,
        description: pluginDescription
    ]
    inputs.properties(pluginProperties)
    filesMatching('plugin.yml') {
        expand(pluginProperties)
    }
}
