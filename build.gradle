plugins {
    id 'com.github.jruk8.plugin-conventions' version 'v1.4.4'
    id 'maven-publish'
}

repositories {
    maven {
        name = 'placeholderapi'
        url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
    }
}

dependencies {
    // PlaceholderAPI
    compileOnly 'me.clip:placeholderapi:2.12.3'

    // LuckPerms (softdepend): role contexts only, never bundled.
    compileOnly 'net.luckperms:api:5.5'

    compileOnly 'com.zaxxer:HikariCP:7.1.0'
    compileOnly 'org.xerial:sqlite-jdbc:3.53.2.1'
    compileOnly 'org.postgresql:postgresql:42.7.13'

    // Compile time only: trivial getters/setters generate into bytecode.
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    // Tests exercise the real SQLite engine store, so the drivers must be
    // present at test runtime. The shipped plugin still loads them through
    // the plugin.yml libraries section instead of bundling them.
    testRuntimeOnly 'com.zaxxer:HikariCP:7.1.0'
    testRuntimeOnly 'org.xerial:sqlite-jdbc:3.53.2.1'
    // Tests mock JManhuntPlugin, and mocking resolves the PlaceholderAPI
    // expansion superclass, so PAPI must be present at test runtime too.
    testRuntimeOnly 'me.clip:placeholderapi:2.12.3'
    // Context calculator tests import LuckPerms types and instantiate the
    // calculator, so the API must be present at test compile and runtime.
    testCompileOnly 'net.luckperms:api:5.5'
    testRuntimeOnly 'net.luckperms:api:5.5'
}

// Publishes the JManhunt API so other plugins (e.g. JManhunt-Challenges) can
// depend on it. The coordinate matches the JitPack coordinate for this
// repository (com.github.jruk8:JManhunt:<tag>); locally, run
// `./gradlew publishToMavenLocal` and add `mavenLocal()` to the consumer.
publishing {
    publications {
        jmanhunt(MavenPublication) {
            groupId = 'com.github.jruk8'
            artifactId = 'JManhunt'
            artifact shadowJar
        }
    }
}
